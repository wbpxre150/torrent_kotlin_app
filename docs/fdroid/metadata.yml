# fdroiddata recipe for com.torrent.app — verified with `fdroid build --test` (fdroidserver 2.4.6,
# 2026-11-26): "1 build succeeded", 16.7 MB arm64-v8a APK, and `fdroid scanner` now reports 0
# errors / 0 warnings (see the scanignore block below).
# Target path in the fdroiddata MR: metadata/com.torrent.app.yml
#
# Everything below that looks fussy was found by running the build, not by reading docs. The
# findings, and what is still a network dependency, are in docs/fdroid/BLOCKERS.md.

# fdroiddata's granular taxonomy (config/categories.yml). "Download" is the torrent-client
# category (LibreTorrent and BiglyBT use it); the app also serves files over FTP and p2p, hence
# "File Transfer". The legacy "Internet" umbrella still exists but is no longer what comparable
# apps use.
Categories:
  - Download
  - File Transfer
License: MIT
AuthorName: Adam Bullock
AuthorEmail: wbpxre150@outlook.com
WebSite: https://github.com/wbpxre150/torrent_kotlin_app
SourceCode: https://github.com/wbpxre150/torrent_kotlin_app
IssueTracker: https://github.com/wbpxre150/torrent_kotlin_app/issues
Changelog: https://github.com/wbpxre150/torrent_kotlin_app/releases

AutoName: Torrent App

RepoType: git
Repo: https://github.com/wbpxre150/torrent_kotlin_app.git

# TetheredNet: the app fetches its two optional data sets from one author-operated host and has
# no mirror list — ~500 MB of MIT-licensed classifier weights from
# https://unjumble.au/bep51/models (sha256-pinned manifests compiled into the crawler) and the
# BEP51 cache bootstrap from https://unjumble.au/bep51/bep51_cache.dat. Both are defaults in
# model_fetch.h / config.c and both are skippable: without them the daemons run, the classifiers
# report clf_ver 0 and the dashboard says the models are missing. Core torrenting, the FTP server
# and the dashboard do not touch the network service at all. Declared rather than argued — a
# reviewer should not have to discover the host from the binary.
AntiFeatures:
  TetheredNet:
    en-US: >-
      Downloads its classifier models (~500 MB) and the BEP51 cache bootstrap from a single
      host operated by the author (unjumble.au). The app stays usable without them, but those
      two features cannot be pointed at another server.


Builds:
  - versionName: '1.0.1'
    versionCode: 7
    # v1.0 predates the build-script knobs (-PnativeRoot, -PprebuiltNativeSrc) and cannot be
    # built by this recipe; v1.0.1 is the first tag that carries them.
    commit: v1.0.1
    # dht_crawler is a git submodule pointing at a public repo; its three lib/ patches are
    # in-tree and applied by prepareDhtCrawlerSrc, so nothing extra is needed.
    submodules: true
    ndk: r27
    # gradle: entries are *flavour names* (fdroid builds assemble<Flavour>Release), so properties
    # go in gradleprops, which are passed as -P<key>[=<value>].
    #   prebuiltNativeSrc — trust the staged trees below instead of downloading tarballs.
    #   nativeRoot        — stage outside app/build/, because fdroid runs `gradle clean` between
    #                       prebuild and the build, and clean deletes build/. Path is relative to
    #                       the app module dir, so app/native-root.
    gradle:
      - yes
    gradleprops:
      - prebuiltNativeSrc
      - nativeRoot=native-root
    # No keystore.properties in a fresh clone, so the release build type stays unsigned and the
    # output is app-release-unsigned.apk. F-Droid signs it afterwards.
    output: app/build/outputs/apk/release/app-release-unsigned.apk
    sudo:
      - apt-get update || apt-get update
      - apt-get install -y cmake ninja-build autoconf automake libtool
    srclibs:
      - mbedtls@mbedtls-3.6.6
      - curl@curl-8_20_0
      - transmission@4.1.4
      - libuv@v1.48.0
      - llama.cpp@18ab62a8ec5144ae5d2f65e78374ba69652d75dd
      - cloudflared@2026.11.0
    # The scanner runs after prebuild (`common.prepare_source` runs prebuild, then build.py does
    # `gradle clean`, then `scanner.scan_source`), so it sees the staged trees. Measured on the
    # v1.0.1 checkout: without this block `fdroid scanner com.torrent.app:7` reports 1312 errors,
    # 1299 of them under app/native-root/src and 13 under app/src/main/cpp/dht_crawler. Every one
    # is upstream third-party test/fuzz data, a package.json of vendored JS test tooling, a macOS
    # framework, or the crawler's own CRAM parser fixtures — none of it is compiled into, or
    # shipped in, the APK.
    #   app/native-root — fdroid's own srclib checkouts, copied here by prebuild. fdroid never
    #                     scans build/srclib; this is the same material in a different place.
    #   dht_crawler/…   — vendored submodule third-party data (libpsl-style fuzz corpora, duktape
    #                     and civetweb test archives, libbloom collision tables) plus tests/fixtures.
    scanignore:
      - app/native-root
      - app/src/main/cpp/dht_crawler/lib/libbloom/misc
      - app/src/main/cpp/dht_crawler/lib/civetweb/src/third_party
      - app/src/main/cpp/dht_crawler/lib/civetweb/test
      - app/src/main/cpp/dht_crawler/lib/cJSON/tests
      - app/src/main/cpp/dht_crawler/lib/uthash/package.json
      - app/src/main/cpp/dht_crawler/tests/fixtures
    # The release tarballs vendor sources that the git trees keep in submodules or generate:
    #   mbedtls      — framework/ submodule
    #   transmission — third-party/ submodules
    #   curl         — configure is generated from configure.ac (there is no buildconf script)
    # sqlite is deliberately absent: its amalgamation is a generated release artifact (tclsh),
    # not something the git tree contains, so fetchSqlite still downloads the official zip.
    prebuild:
      - mkdir -p app/native-root/src
      - (cd $$curl$$ && autoreconf -fi)
      - git -C $$mbedtls$$ submodule update --init --recursive
      - git -C $$transmission$$ submodule update --init --recursive
      - cp -a $$mbedtls$$ app/native-root/src/mbedtls-3.6.6
      - cp -a $$curl$$ app/native-root/src/curl-8.20.0
      - cp -a $$transmission$$ app/native-root/src/transmission-4.1.4
      - cp -a $$libuv$$ app/native-root/src/libuv-v1.48.0
      - cp -a $$llama.cpp$$ app/native-root/src/llama-18ab62a8
      - cp -a $$cloudflared$$ app/native-root/src/cloudflared-2026.11.0

AutoUpdateMode: Version
UpdateCheckMode: Tags
CurrentVersion: '1.0.1'
CurrentVersionCode: 7
