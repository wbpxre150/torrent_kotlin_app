# Draft fdroiddata recipe for com.torrent.app — UNTESTED against `fdroid build`.
# Target path in the fdroiddata MR: metadata/com.torrent.app.yml
#
# The Gradle build fetches its seven native dependencies itself, so this recipe stages them from
# srclibs into app/native-root/src/ and passes -PprebuiltNativeSrc, which makes the two
# sha256-pinned fetches (llama.cpp, cloudflared) accept the staged tree instead of downloading a
# tarball to hash. The five existence-checked fetches skip their download once the tree is there.
# Staging goes outside app/build/ on purpose: fdroid runs `gradle clean` between prebuild and the
# build, and clean deletes build/ (see -PnativeRoot in app/build.gradle.kts).
#
# One remaining network dependency: the Go toolchain for cloudflared (its go.mod requires
# go1.27.4). Decided: the buildserver fetches it, which is why no -PgoToolchain/-PgoVendor is
# passed below. See docs/fdroid/BLOCKERS.md item 2 for the knobs and the reasoning.

Categories:
  - Internet
License: MIT
AuthorName: Adam Bullock
AuthorEmail: wbpxre150@outlook.com
WebSite: https://github.com/wbpxre150/torrent_kotlin_app
SourceCode: https://github.com/wbpxre150/torrent_kotlin_app
IssueTracker: https://github.com/wbpxre150/torrent_kotlin_app/issues
Changelog: https://github.com/wbpxre150/torrent_kotlin_app/releases

AutoName: Torrent App

RepoType: git
Repo: https://github.com/wbpxre150/torrent_kotlin_app.git

# No AntiFeatures. The ~500 MB of classifier weights are downloaded at first run from
# https://unjumble.au/bep51/models (sha256-pinned manifests inside the crawler binary) and are
# MIT licensed, same as the app — see the LICENSE in the classifier-model repo.

Builds:
  - versionName: '1.0'
    versionCode: 6
    commit: v1.0
    # dht_crawler is a git submodule pointing at a public repo; its three lib/ submodule
    # patches are in-tree and applied by prepareDhtCrawlerSrc, so nothing extra is needed.
    submodules: true
    ndk: r27
    # prebuiltNativeSrc: trust the staged trees below instead of downloading tarballs.
    # nativeRoot: stage outside app/build/, because fdroid runs `gradle clean` after `prebuild`
    # and clean deletes build/. The path is relative to the app module dir.
    gradle:
      - yes
    gradleprops:
      - prebuiltNativeSrc
      - nativeRoot=native-root
    output: app/build/outputs/apk/release/app-release.apk
    sudo:
      - apt-get update || apt-get update
      - apt-get install -y cmake ninja-build
    srclibs:
      - mbedtls@mbedtls-3.6.6
      - curl@curl-8_20_0
      - transmission@4.1.4
      - libuv@v1.48.0
      - sqlite@version-3.49.1
      - llama.cpp@18ab62a8ec5144ae5d2f65e78374ba69652d75dd
      - cloudflared@2026.11.0
    # The transmission tarball ships vendored third-party sources, so its srclib checkout needs
    # --recurse-submodules if the git repo does not carry them.
    prebuild:
      - mkdir -p app/native-root/src
      - cp -a $$mbedtls$$ app/native-root/src/mbedtls-3.6.6
      - cp -a $$curl$$ app/native-root/src/curl-8.20.0
      - cp -a $$transmission$$ app/native-root/src/transmission-4.1.4
      - cp -a $$libuv$$ app/native-root/src/libuv-v1.48.0
      - cp -a $$sqlite$$ app/native-root/src/sqlite-amalgamation
      - cp -a $$llama.cpp$$ app/native-root/src/llama-18ab62a8
      - cp -a $$cloudflared$$ app/native-root/src/cloudflared-2026.11.0

AutoUpdateMode: Version
UpdateCheckMode: Tags
CurrentVersion: '1.0'
CurrentVersionCode: 6
