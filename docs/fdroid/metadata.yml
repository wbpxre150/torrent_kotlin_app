AntiFeatures:
  TetheredNet:
    en-US: Downloads its classifier models (~500 MB) and the BEP51 cache bootstrap
      from a single host operated by the author (unjumble.au). The app stays usable
      without them, but those two features cannot be pointed at another server.
Categories:
  - Download
  - File Transfer
License: MIT
AuthorName: Adam Bullock
AuthorEmail: wbpxre150@outlook.com
WebSite: https://github.com/wbpxre150/torrent_kotlin_app
SourceCode: https://github.com/wbpxre150/torrent_kotlin_app
IssueTracker: https://github.com/wbpxre150/torrent_kotlin_app/issues
Changelog: https://github.com/wbpxre150/torrent_kotlin_app/releases

AutoName: Torrent App

RepoType: git
Repo: https://github.com/wbpxre150/torrent_kotlin_app.git

Builds:
  - versionName: 1.0.3
    versionCode: 9
    commit: 3dfe39821a558f858d713dd40ab917a17cae8eb5
    submodules: true
    sudo:
      - apt-get update || apt-get update
      - apt-get install -y cmake ninja-build autoconf automake libtool curl
      - curl -fsSL -o /tmp/go.tgz https://go.dev/dl/go1.27.4.linux-amd64.tar.gz &&
        echo "7226736c2339719cda28fbf3a54d71aa63bcefe376e98cef00034268dab24840 /tmp/go.tgz"
        | sha256sum -c - && tar -C /usr/local -xzf /tmp/go.tgz && ln -sf /usr/local/go/bin/go
        /usr/bin/go
    gradle:
      - yes
    output: app/build/outputs/apk/release/app-release-unsigned.apk
    srclibs:
      - mbedtls@mbedtls-3.6.6
      - curl@curl-8_20_0
      - transmission@4.1.4
      - libuv@v1.48.0
      - llama.cpp@18ab62a8ec5144ae5d2f65e78374ba69652d75dd
      - cloudflared@2026.11.0
    prebuild:
      - rm -rf ../native-root && mkdir -p ../native-root/src
      - pushd $$curl$$ && autoreconf -fi && popd
      - git -C $$mbedtls$$ submodule update --init --recursive
      - git -C $$transmission$$ submodule update --init --recursive
      - cp -a $$mbedtls$$ ../native-root/src/mbedtls-3.6.6
      - cp -a $$curl$$ ../native-root/src/curl-8.20.0
      - sed -i 's/"8\.20\.0-DEV"/"8.20.0"/' ../native-root/src/curl-8.20.0/include/curl/curlver.h
      - cp -a $$transmission$$ ../native-root/src/transmission-4.1.4
      - cp -a $$libuv$$ ../native-root/src/libuv-v1.48.0
      - cp -a $$llama.cpp$$ ../native-root/src/llama-18ab62a8
      - cp -a $$cloudflared$$ ../native-root/src/cloudflared-2026.11.0
    scanignore:
      - app/src/main/cpp/dht_crawler/lib/libbloom/misc
      - app/src/main/cpp/dht_crawler/lib/civetweb/src/third_party
      - app/src/main/cpp/dht_crawler/lib/civetweb/test
      - app/src/main/cpp/dht_crawler/lib/cJSON/tests
      - app/src/main/cpp/dht_crawler/lib/uthash/package.json
      - app/src/main/cpp/dht_crawler/tests/fixtures
    ndk: r27
    gradleprops:
      - prebuiltNativeSrc
      - nativeRoot=../../native-root

AutoUpdateMode: Version
UpdateCheckMode: Tags
CurrentVersion: 1.0.3
CurrentVersionCode: 9
