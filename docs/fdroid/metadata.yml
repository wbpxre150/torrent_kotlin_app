# fdroiddata recipe for com.torrent.app — verified with `fdroid build --test` (fdroidserver 2.4.6,
# 2026-11-26): "1 build succeeded", 16.7 MB arm64-v8a APK.
# Target path in the fdroiddata MR: metadata/com.torrent.app.yml
#
# Everything below that looks fussy was found by running the build, not by reading docs. The
# findings, and what is still a network dependency, are in docs/fdroid/BLOCKERS.md.

Categories:
  - Internet
License: MIT
AuthorName: Adam Bullock
AuthorEmail: wbpxre150@outlook.com
WebSite: https://github.com/wbpxre150/torrent_kotlin_app
SourceCode: https://github.com/wbpxre150/torrent_kotlin_app
IssueTracker: https://github.com/wbpxre150/torrent_kotlin_app/issues
Changelog: https://github.com/wbpxre150/torrent_kotlin_app/releases

AutoName: Torrent App

RepoType: git
Repo: https://github.com/wbpxre150/torrent_kotlin_app.git

# No AntiFeatures. The ~500 MB of classifier weights are downloaded at first run from
# https://unjumble.au/bep51/models (sha256-pinned manifests inside the crawler binary) and are
# MIT licensed, same as the app — see the LICENSE in the classifier-model repo.

Builds:
  - versionName: '1.0'
    versionCode: 6
    # Must be a tag or commit that contains the build-script knobs (-PnativeRoot,
    # -PprebuiltNativeSrc). The v1.0 tag predates them; use the next release tag, or the commit
    # below until one exists.
    commit: 8bc4d5bf8728a1ac0c3d31a69fbb9efebefbd70d
    # dht_crawler is a git submodule pointing at a public repo; its three lib/ patches are
    # in-tree and applied by prepareDhtCrawlerSrc, so nothing extra is needed.
    submodules: true
    ndk: r27
    # gradle: entries are *flavour names* (fdroid builds assemble<Flavour>Release), so properties
    # go in gradleprops, which are passed as -P<key>[=<value>].
    #   prebuiltNativeSrc — trust the staged trees below instead of downloading tarballs.
    #   nativeRoot        — stage outside app/build/, because fdroid runs `gradle clean` between
    #                       prebuild and the build, and clean deletes build/. Path is relative to
    #                       the app module dir, so app/native-root.
    gradle:
      - yes
    gradleprops:
      - prebuiltNativeSrc
      - nativeRoot=native-root
    # No keystore.properties in a fresh clone, so the release build type stays unsigned and the
    # output is app-release-unsigned.apk. F-Droid signs it afterwards.
    output: app/build/outputs/apk/release/app-release-unsigned.apk
    sudo:
      - apt-get update || apt-get update
      - apt-get install -y cmake ninja-build autoconf automake libtool
    srclibs:
      - mbedtls@mbedtls-3.6.6
      - curl@curl-8_20_0
      - transmission@4.1.4
      - libuv@v1.48.0
      - llama.cpp@18ab62a8ec5144ae5d2f65e78374ba69652d75dd
      - cloudflared@2026.11.0
    # The release tarballs vendor sources that the git trees keep in submodules or generate:
    #   mbedtls      — framework/ submodule
    #   transmission — third-party/ submodules
    #   curl         — configure is generated from configure.ac (there is no buildconf script)
    # sqlite is deliberately absent: its amalgamation is a generated release artifact (tclsh),
    # not something the git tree contains, so fetchSqlite still downloads the official zip.
    prebuild:
      - mkdir -p app/native-root/src
      - (cd $$curl$$ && autoreconf -fi)
      - git -C $$mbedtls$$ submodule update --init --recursive
      - git -C $$transmission$$ submodule update --init --recursive
      - cp -a $$mbedtls$$ app/native-root/src/mbedtls-3.6.6
      - cp -a $$curl$$ app/native-root/src/curl-8.20.0
      - cp -a $$transmission$$ app/native-root/src/transmission-4.1.4
      - cp -a $$libuv$$ app/native-root/src/libuv-v1.48.0
      - cp -a $$llama.cpp$$ app/native-root/src/llama-18ab62a8
      - cp -a $$cloudflared$$ app/native-root/src/cloudflared-2026.11.0

AutoUpdateMode: Version
UpdateCheckMode: Tags
CurrentVersion: '1.0'
CurrentVersionCode: 6
